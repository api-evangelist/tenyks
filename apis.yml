aid: tenyks
name: Tenyks
description: >-
  Tenyks is a University of Cambridge spin-out (Y Combinator; backed by
  Speedinvest) building a visual-intelligence platform for computer vision. Its
  original product is an MLOps monitoring and validation platform that helps ML
  engineers working with computer-vision data find and fix what is wrong with
  their models — data-quality analysis, model performance comparison,
  text-to-image / image-to-image / object-level similarity search, embeddings,
  tagging and custom metadata across image and video datasets. Tenyks has since
  extended into a Vision AI / Video AI Agents platform that turns everyday
  camera feeds into privacy-first operational analytics for brick-and-mortar
  businesses. The Tenyks API (currently alpha, for Premium/Dashboard users, with
  a freemium Sandbox) lets teams authenticate with an API key + secret to obtain
  a Bearer token, then create datasets and models, and upload and ingest
  annotations and predictions directly from AWS S3, GCS or Azure. A Python SDK
  and CLI wrap the same surface.
